<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-toolbar color="primary" class="sidenav-toolbar">
      <mat-icon>school</mat-icon>
      <span>Learn Spanish</span>
    </mat-toolbar>

    <mat-nav-list>
      @for (topic of topics(); track topic.id) {
        <a mat-list-item [routerLink]="['/', topic.id]" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ topic.icon }}</mat-icon>
          <span matListItemTitle>{{ topic.title }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="main-toolbar">
      <span>Spanish Language Learning</span>
      <span class="spacer"></span>
      @if (user(); as user) {
        <span class="username">{{ user.username }}</span>
      }
      <button mat-icon-button matTooltip="Logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
