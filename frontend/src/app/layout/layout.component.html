<mat-sidenav-container class="sidenav-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <mat-toolbar color="primary" class="sidenav-toolbar">
      <mat-icon>school</mat-icon>
      <span>Learn Spanish</span>
    </mat-toolbar>

    <mat-nav-list>
      <a mat-list-item [routerLink]="['/home']" class="home-link">
        <mat-icon matListItemIcon>home</mat-icon>
        <span matListItemTitle>На главную</span>
      </a>
      @for (topic of topics(); track topic.id) {
        <a mat-list-item [routerLink]="['/classic', topic.id]" routerLinkActive="active-link">
          <mat-icon matListItemIcon>{{ topic.icon }}</mat-icon>
          <span matListItemTitle>{{ topic.title }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-divider />
      <div class="lang-toggle">
        <mat-icon class="toggle-icon">translate</mat-icon>
        <span class="toggle-label">Тільки іспанська</span>
        <mat-slide-toggle
          color="primary"
          [checked]="settings.spanishOnly()"
          (change)="settings.setSpanishOnly($event.checked)" />
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar color="primary" class="main-toolbar">
      <span>Spanish Language Learning</span>
      <span class="spacer"></span>
      @if (user(); as user) {
        <span class="username">{{ user.username }}</span>
      }
      <button mat-icon-button matTooltip="Logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <div class="content-area">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
